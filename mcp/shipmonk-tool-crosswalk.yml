    targets. An agent must first call list-endpoints / get-endpoint to learn that contract.
mcp_only:
- tool: list-endpoints
  reason: Spec introspection over the OpenAPI description; there is no REST endpoint that lists ShipMonk's own endpoints.
- tool: get-endpoint
  reason: Spec introspection - returns an operation's detail, security scheme and servers from the description.
- tool: search-endpoints
  reason: Spec search over paths, operations and parameters; no REST equivalent.
- tool: get-server-variables

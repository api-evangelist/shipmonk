description: >-
  Binding between ShipMonk's published MCP tools and its OpenAPI operations. ShipMonk's MCP
  server is spec-driven rather than operation-per-tool, so the crosswalk is inverted from the
  usual shape: four discovery tools have no REST equivalent (they read the spec, not the API),
  and one execution tool fans out to every operation in the spec. No ShipMonk capability is
  MCP-exclusive, and no REST operation is unreachable from MCP - but no operation has a named
  tool or a typed inputSchema either, so an agent must discover the contract at runtime.
surfaces:
  openapi:
    file: openapi/_original/shipmonk-openapi.json
    published: https://apidocs.shipmonk.com/openapi/public_api.json
    operations: 19
    webhooks: 4
    gated: false
  mcp:
    url: https://apidocs.shipmonk.com/mcp
    tools: 5
    gated: false
    note: tools/list responds anonymously; execute-request requires a ShipMonk Api-Key supplied by the caller.
  graphql: null
crosswalk:
- tool: execute-request
  category: execution
  binding: rest
  confidence: high
  rest: [get-v1-integrations-receiving, post-v1-integrations-receiving, get-v1-integrations-returns,
    post-v1-integrations-returns, post-v1-integrations-order, get-v1-integrations-orders,
    get-v1-integrations-orders-list, post-v1-integrations-product, post-v1-integrations-products-search,
    get-v1-integrations-products-search-paginate, get-v1-integrations-receipts-list,

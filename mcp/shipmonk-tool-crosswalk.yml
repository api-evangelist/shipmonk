observations:
- Every write operation is reachable through a single generic tool, so tool-level authorization is not possible - an agent granted execute-request can create orders and products as readily as it can read them.
- The three sandbox simulation endpoints are reachable through the same tool as production writes; environment separation depends entirely on the base URL in the HAR request.
- The 4 webhook events are not represented in MCP at all.

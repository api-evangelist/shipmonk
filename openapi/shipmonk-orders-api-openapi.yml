    ShipMonk_PublicApi_Order_OrderCreateOrUpdate_CreateOrUpdateOrderItemInput:
      type: object
      properties:
        sku:
          description: Marketplace Stock Keeping Unit (SKU) of the product; must match an existing product.
          type: string
          maxLength: 255
        quantity:
          description: Number of units of this SKU on the order line; must be a positive integer.
          type: integer
          minimum: 0
          maximum: 999999
        line_key:
          description: Optional external key identifying this line item, useful for matching updates against the source system's line.
          type:
          - string
          - 'null'
          maxLength: 255
          default: null
        name:
          description: Display name for the product on this line. Optional; immutable after the item is created.
          type:
          - string
          - 'null'
          maxLength: 65536
          default: null
        price:
          description: Per-unit price of the product in the order currency. Optional; immutable after the item is created.
          type:
          - number
          - 'null'
          format: double
          default: null
        packing_group:
          description: Optional group identifier; items sharing the same packing_group.key should be packed together in the same parcel.
          anyOf:
          - $ref: '#/components/schemas/ShipMonk_PublicApi_Order_OrderCreateOrUpdate_CreateOrUpdateOrderItemPackingGroupInput'
          - type: 'null'
          default: null
        custom_data:
          description: Optional custom name/value pairs attached to the line item for integration metadata. Immutable after the item is created.
          type: array
          items:
            $ref: '#/components/schemas/ShipMonk_PublicApi_Order_OrderCreateOrUpdate_CreateOrUpdateOrderCustomDataInput'
          default: []
        b2b_attributes:
          description: Optional B2B-specific attributes (e.g. retailer compliance fields) attached to the line. Immutable after the item is created.
          type: array
          items:
            $ref: '#/components/schemas/ShipMonk_PublicApi_Order_OrderCreateOrUpdate_CreateOrUpdateOrderItemB2BAttributeInput'
          default: []
        special_instructions:
          description: Special handling instructions to apply to this line item; omit when none are needed.
          type: array
          items:
            $ref: '#/components/schemas/ShipMonk_PublicApi_Order_OrderCreateOrUpdate_CreateOrUpdateOrderItemSpecialInstructionInput'
          default: []
        image_url:
          description: Publicly accessible image URL of the product. Set on creation only; updates are ignored once the item exists.
          type:
          - string
          - 'null'
          maxLength: 2048
          default: null
        lot_requirements:
          description: Lot/expiration constraints that pickers must honor for this item. Can only be set before the order is submitted to the warehouse; later updates are ignored.
          anyOf:
          - $ref: '#/components/schemas/ShipMonk_PublicApi_Order_OrderCreateOrUpdate_CreateOrUpdateOrderItemLotRequirementsInput'
          - type: 'null'
          default: null
      required:
      - sku
      - quantity
      title: Create Or Update Order Item Input

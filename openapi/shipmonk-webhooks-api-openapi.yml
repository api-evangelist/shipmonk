          description: Carrier authorization number (e.g. PRO or pickup authorization) issued for the shipment; null if not provided.
          type:
          - string
          - 'null'
        estimated_shipping_cost:
          description: Estimated shipping cost in the order's currency; null if not yet calculated.
          type:
          - number
          - 'null'
          format: double
        routing:
          description: Routing information assigned to the shipment (e.g. for retailer-routed freight); null when routing is not applicable.

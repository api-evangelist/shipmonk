      - shipping_paid
      - tax_paid
      - order_costs
      - ship_from
      - ship_to
      - order_status
      - processing_status
      - items
      - attributes
      - currency_code
      - references
      - custom_data
      - special_requirements
      - actions_required
      - master_tracking_number
      - tracking_url
      - returns
      - packages
      - tax_id
      - recipient_tax_id
      - shipment_data
      - order_parts
      - shipped_at
      - updated_at
      - order_size
      - extra_data
      - serial_numbers
      - gift_message
      - gift_from
      - customer_notes
      - order_detail_url

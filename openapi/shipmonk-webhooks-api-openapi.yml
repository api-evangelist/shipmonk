          description: Master bill of lading number grouping multiple BOLs under a consolidated shipment; null if not consolidated.
          type:
          - string
          - 'null'
        load_number:
          description: Carrier-assigned load number identifying the freight load this shipment belongs to; null if not provided.
          type:
          - string
          - 'null'

          type:
          - string
          - 'null'
        customer_notes:
          description: Customer-provided notes about the order; null if no notes were submitted.
          type:
          - string
          - 'null'
        order_detail_url:
          description: URL to view the order in the ShipMonk web application (requires sign-in).

          type: array
          items:
            $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_ShipmentNotificationExtraDataOutput'
        routing:
          description: Routing information for the shipment; null when the order has no routing.
          anyOf:
          - $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_RoutingOutput'
          - type: 'null'
        ordered_at:
          description: Time the order was placed. Returned as an ISO 8601 string for most stores, or as a structured date object for selected legacy integrations.
          anyOf:
          - $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_DateTimeOutput'
          - type: string
        shipped_at:
          description: Time the order shipped. Returned as an ISO 8601 string for most stores, or as a structured date object for selected legacy integrations.
          anyOf:
          - $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_DateTimeOutput'
          - type: string
        packages:
          description: Packages (boxes) that make up the shipment.
          type: array
          items:
            $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_PackageOutput'
        pallets:
          description: Pallets consolidating the shipment packages; empty when the shipment is not palletized.
          type: array
          items:
            $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_PalletOutput'
        ship_from:
          description: Origin (sender) address of the shipment; null when not provided.
          anyOf:
          - $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_ShipFromAddressOutput'
          - type: 'null'
        ship_to:
          description: Destination (recipient) address of the shipment.
          $ref: '#/components/schemas/ShipMonk_OMS_Notification_ApiResource_ShipToAddressOutput'
      required:
      - order_key
      - parent_order_key
      - order_number
      - warehouse
      - items
      - store_id
      - carrier
      - service
      - master_tracking_number
      - tracking_link
      - estimated_shipping_cost
      - custom_data
      - carrier_tracking_url
      - carrier_alpha_code
      - carrier_trans_method_code
      - bill_of_lading_number
      - master_bill_of_lading_number
      - load_number
      - authorization_number
      - order_parts
      - serial_numbers
      - order_size
      - extra_data
      - routing
      - ordered_at
      - shipped_at
      - packages
      - pallets
      - ship_from
      - ship_to
      title: Shipment Notification Output

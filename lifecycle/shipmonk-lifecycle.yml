versioning:
  scheme: uri-path + documentation release train
  current: v1
  spec_version: v1.024
  mechanism: >-
    Every operation is served under the /v1/ path prefix. Within v1 the contract itself is
    versioned as a documentation release train (v1.015 ... v1.024) published on the
    changelog; the OpenAPI info.version carries the current train number. There is no
    version request header and no per-account version pinning.
  docs: https://apidocs.shipmonk.com/changelog
deprecation:
  policy_url: https://apidocs.shipmonk.com/changelog
  sunset_header: false
  deprecation_header: false
  mechanism: >-
    Deprecations are announced in the changelog and marked in the OpenAPI with
    "deprecated": true plus an inline removal date in the field description
    (e.g. "Deprecated: Will be removed on 2026-09-30. Use type instead."). Breaking
    removals are shipped in a numbered release with an explicit BREAKING marker and a
    migration paragraph. No RFC 8594 Sunset/Deprecation response headers are emitted.
  observed_notice_period: >-
    The item-level sscc field was deprecated in v1.018 with a published removal date of
    2026-06-30 and removed in v1.023 — roughly a two-quarter migration window.

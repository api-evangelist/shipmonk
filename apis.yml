- aid: shipmonk:shipmonk-orders-api
  name: ShipMonk Orders API
  description: Create, update, read and release outbound customer orders for pick, pack and ship, and
    simulate warehouse shipment in sandbox. Orders are upserted on store_id + order_key, released with
    submit-order, and tracked through 18 processing statuses.
  humanURL: https://apidocs.shipmonk.com/reference
  baseURL: https://api.shipmonk.com

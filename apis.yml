apis:
- aid: shipmonk:shipmonk-webhooks
  name: ShipMonk Webhooks
  description: >-
    The ShipMonk event surface: four HTTP callback events (order shipment notification, order status change,
    return status change, receiving status change) declared in the OpenAPI 3.1 webhooks block. Deliveries
    authenticate with HTTP Basic and carry an X-Sm-Signature HMAC-SHA512 integrity header, with exponential-backoff
    retries.
  humanURL: https://apidocs.shipmonk.com/reference/webhooks
  baseURL: https://api.shipmonk.com
  tags:
  - Logistics
  - Fulfillment
  - Webhook
  - Event
  tags_raw:
  - Logistics
  - Fulfillment
  - Webhooks
  - Events
  properties:
  - type: AsyncAPI
    url: asyncapi/shipmonk-webhooks-asyncapi.yml
  - type: Webhooks
    url: https://apidocs.shipmonk.com/reference/webhooks
  - type: Documentation
    url: https://apidocs.shipmonk.com/reference/webhooks
- aid: shipmonk:shipmonk-mcp
  name: ShipMonk MCP Server
  description: >-
    A live Model Context Protocol endpoint served from ShipMonk's own developer-docs host. tools/list
    responds anonymously with five spec-driven tools: four OpenAPI introspection tools plus execute-request,
    a HAR-shaped proxy that can invoke any of the 19 ShipMonk REST operations.
  humanURL: https://apidocs.shipmonk.com/
  baseURL: https://apidocs.shipmonk.com/mcp
  tags:
  - MCP
  - Agents
  - Logistics
  - Fulfillment
  properties:

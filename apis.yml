description: ShipMonk is a Florida-headquartered third-party logistics (3PL) and ecommerce fulfillment
  provider operating a network of fulfillment centres across the United States, Canada, Mexico, the United
  Kingdom and Czechia. It runs an order management system for direct-to-consumer, retail/B2B and marketplace
  brands covering inbound receiving, inventory and lot control, pick-and-pack fulfillment, multi-carrier
  shipping and returns. Its public API is a single REST surface at api.shipmonk.com, described by a self-published
  OpenAPI 3.1 document covering orders, products and inventory, receivings, returns and warehouses, with
  four HTTP webhook events for shipment, order, return and receiving status changes and a contract-only
  sandbox environment with warehouse simulation endpoints.

description: >-
  ShipMonk publishes a per-release changelog on its developer hub. Each entry is a numbered
  documentation/contract release (v1.0xx) with sections for new endpoints, schema and
  property updates, new support schemas, removals, and documentation-only changes. Breaking
  changes are marked explicitly and carry a migration paragraph.

description: >-
  Entity-relationship graph of the ShipMonk fulfillment domain, derived from the schema graph
  of ShipMonk's own OpenAPI 3.1 description and the concepts reference. The domain has two
  inbound spines (Receiving of new stock, Returns of shipped goods), one outbound spine
  (Order to Shipment), and Product + Warehouse as the shared reference data both depend on.
identifiers:
  note: >-
    ShipMonk uses caller-supplied natural keys rather than prefixed opaque ids. These keys are
    also the idempotency contract - see conventions/shipmonk-conventions.yml.
  keys:
